name = "mails-worker"
main = "src/index.ts"
workers_dev = true
compatibility_date = "2024-12-01"
routes = [{ pattern = "mails-worker.canyin.uk/*", zone_name = "canyin.uk" }]

[[d1_databases]]
binding = "DB"
database_name = "mails-chat-prod"
database_id = "1fdba7cb-8f19-4c95-a595-c4a47130d47b"

[[services]]
binding = "REALTIME_NOTIFY_SERVICE"
service = "mails-realtime-notify"

[vars]
MAILBOX = "chat@canyin.uk"
OUTBOUND_FROM_EMAIL = "chat@canyin.uk"
INTERNAL_MAILBOX_DOMAINS = "canyin.uk,yepage.net"
RESEND_FROM_EMAIL = "chat@canyin.uk"
ZEPTOMAIL_FROM_EMAIL = "chat@yepage.net"
ZEPTOMAIL_API_BASE_URL = "https://api.zeptomail.eu"
REALTIME_NOTIFY_BASE_URL = "https://mails-realtime-internal.canyin.uk"

# ---- Outbound email providers ----
#
# Default provider chain = "cloudflare,zeptomail,resend,ses" (providers lacking
# configuration are silently skipped). Override with:
#   wrangler secret put EMAIL_PROVIDERS   # e.g. "zeptomail", "resend", or "cloudflare,zeptomail,resend,ses"
#
# Provider: Resend — set the API key as a secret:
#   wrangler secret put RESEND_API_KEY
# Optional verified sender override when Resend uses a dedicated domain:
#   RESEND_FROM_EMAIL=chat@canyin.uk
#
# Provider: ZeptoMail — set the API key as a secret:
#   wrangler secret put ZEPTOMAIL_API_KEY
# Optional verified sender override when ZeptoMail uses a different domain:
#   ZEPTOMAIL_FROM_EMAIL=chat@yepage.net
#
# Provider: AWS SES — set Worker secrets:
#   wrangler secret put AWS_SES_REGION
#   wrangler secret put AWS_ACCESS_KEY_ID
#   wrangler secret put AWS_SECRET_ACCESS_KEY
#   wrangler secret put AWS_SESSION_TOKEN  # optional
#   wrangler secret put AWS_SES_ENDPOINT   # optional custom endpoint
#
# Provider: Cloudflare Email Service (public beta) — add a send_email binding:
#   [[send_email]]
#   name = "EMAIL"
#   # destination_address = "allowed@example.com"  # optional allowlist
